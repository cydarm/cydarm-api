  /v0.9/case:
    get:
      description: >
        Returns a paginated, filtered list of cases conforming to JSON:API
        specification.

        Supports sparse fieldsets via fields[case] parameter and related
        resource inclusion via include parameter.
      operationId: CaseGet
      parameters:
        - description: The results page to return
          in: query
          name: page[number]
          required: true
          schema:
            type: integer
        - description: The size of each page to return
          in: query
          name: page[size]
          required: true
          schema:
            type: integer
        - description: Which additional objects to include
          in: query
          name: include
          required: false
          schema:
            items:
              type: string
            type: array
        - description: >
            Sparse fieldsets - comma-separated list of fields to include in the
            response.

            If specified, only the listed fields (attributes and relationships)
            will be returned.

            If not specified, all fields are returned.

            Example: fields[case]=locator,description,severity
          in: query
          name: fields[case]
          required: false
          schema:
            type: string
        - description: Filter cases created on or after this timestamp (ISO 8601 format)
          in: query
          name: filter[create_start]
          required: false
          schema:
            format: date-time
            type: string
        - description: Filter cases created on or before this timestamp (ISO 8601 format)
          in: query
          name: filter[create_end]
          required: false
          schema:
            format: date-time
            type: string
        - description: Filter cases modified on or after this timestamp (ISO 8601 format)
          in: query
          name: filter[mod_start]
          required: false
          schema:
            format: date-time
            type: string
        - description: Filter cases modified on or before this timestamp (ISO 8601 format)
          in: query
          name: filter[mod_end]
          required: false
          schema:
            format: date-time
            type: string
        - description: >-
            Filter cases by workflow status (comma-delimited list of status
            names)
          in: query
          name: filter[status]
          required: false
          schema:
            type: string
        - description: >-
            Filter cases by organisation (comma-delimited list of organisation
            names)
          in: query
          name: filter[org]
          required: false
          schema:
            type: string
        - description: Filter cases by assignee (comma-delimited list of assignee names)
          in: query
          name: filter[assignee]
          required: false
          schema:
            type: string
        - description: Filter cases by severity (comma-delimited list of severity names)
          in: query
          name: filter[severity]
          required: false
          schema:
            type: string
        - description: >-
            Full-text search across case locator, description, and metadata
            values
          in: query
          name: filter[text]
          required: false
          schema:
            type: string
        - description: Filter cases by parent case UUIDs (comma-delimited list of UUIDs)
          in: query
          name: filter[parent_uuid]
          required: false
          schema:
            type: string
        - description: Filter cases by member case UUID
          in: query
          name: filter[member_uuid]
          required: false
          schema:
            format: uuid
            type: string
        - description: >-
            Filter cases that have any of these tags (comma-delimited list of
            tag names)
          in: query
          name: filter[inc_tag]
          required: false
          schema:
            type: string
        - description: >-
            Filter cases that do not have any of these tags (comma-delimited
            list of tag names)
          in: query
          name: filter[exc_tag]
          required: false
          schema:
            type: string
        - description: >-
            Filter for cases that have no tags (cannot be used with
            filter[inc_tag])
          in: query
          name: filter[untagged]
          required: false
          schema:
            type: boolean
        - description: >-
            Field to sort results by (description, created, modified, org,
            assignee, status, severity, severity_name, min_sla_name,
            min_sla_seconds, closed, actions, completed_actions)
          in: query
          name: sort
          required: false
          schema:
            default: created
            type: string
        - description: Sort direction (asc or desc)
          in: query
          name: sort_dir
          required: false
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CaseListTopLevel'
          description: The filtered list of cases
        '400':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CaseGet_400_response'
          description: Bad request - invalid filter parameters
      summary: Get filtered list of cases
      tags:
        - v09_case
