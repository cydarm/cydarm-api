  /v0.9/visualization:
    get:
      description: Returns Vega-Lite formatted data to be visually displayed
      parameters:
        - description: The visual shape of the chart
          in: query
          name: chartType
          required: true
          schema:
            enum:
              - bar
              - pie
              - heatmap
              - line
              - table
            type: string
        - description: The data source for the visualization
          in: query
          name: dataType
          required: true
          schema:
            enum:
              - case-data
              - sla-data
            type: string
        - description: Earliest creation timestamp in ISO 8601 format
          in: query
          name: filter[create_start]
          required: false
          schema:
            type: string
        - description: Latest creation timestamp in ISO 8601 format
          in: query
          name: filter[create_end]
          required: false
          schema:
            type: string
        - description: Comma-delimited list of state names to filter by
          in: query
          name: filter[state]
          required: false
          schema:
            type: string
        - description: Comma-delimited list of org names or UUIDs to filter by
          in: query
          name: filter[org]
          required: false
          schema:
            type: string
        - description: Comma-delimited list of assignee names to filter by
          in: query
          name: filter[assignee]
          required: false
          schema:
            type: string
        - description: Comma-delimited list of severity names to filter by
          in: query
          name: filter[severity]
          required: false
          schema:
            type: string
        - description: Comma-delimited list of tags to include
          in: query
          name: filter[inc_tag]
          required: false
          schema:
            type: string
        - description: Comma-delimited list of tags to exclude
          in: query
          name: filter[exc_tag]
          required: false
          schema:
            type: string
        - description: >-
            Number of items per page. Used by table (default 20) and bar with
            group_by_x=tag (default 10).
          in: query
          name: page[size]
          required: false
          schema:
            type: integer
        - description: >-
            Zero-indexed page number. Used by table (default 0). Ignored by
            other chart types.
          in: query
          name: page[number]
          required: false
          schema:
            type: integer
        - description: Time interval for time-series charts (defaults vary by chart type)
          in: query
          name: transform[interval]
          required: false
          schema:
            pattern: ^[1-9][0-9]?[hdwMQy]$
            type: string
        - description: Primary grouping axis. Allowed values depend on the chart type.
          in: query
          name: transform[group_by_x]
          required: false
          schema:
            type: string
        - description: Secondary grouping axis. Allowed values depend on the chart type.
          in: query
          name: transform[group_by_y]
          required: false
          schema:
            type: string
        - description: Aggregation function. Allowed values depend on the data type.
          in: query
          name: transform[aggregate]
          required: false
          schema:
            type: string
        - description: Sort field name for result ordering
          in: query
          name: transform[sort]
          required: false
          schema:
            type: string
        - description: Sort direction for result ordering
          in: query
          name: transform[sort_dir]
          required: false
          schema:
            enum:
              - asc
              - desc
            type: string
        - description: >-
            IANA timezone name (e.g. "Australia/Sydney", "America/New_York").
            Controls time-bucketing alignment and time-derived dimensions
            (day_of_week, hour_of_day). Defaults to UTC if omitted. Returns 400
            for invalid IANA timezone names.
          in: query
          name: transform[timezone]
          required: false
          schema:
            default: UTC
            type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/VisualizationTopLevel'
          description: The Vega-Lite chart visualization
      summary: >-
        Gets a specific data set visualization for a chart -- specifically in
        Vega format
      tags:
        - v09_visualization
