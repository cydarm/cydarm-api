    WikiPagePatchResource:
      description: >
        JSON:API partial-update resource for a wiki page. Any subset of
        attributes

        and relationships may be supplied; unsupplied fields are left untouched.


        Position changes are expressed relatively via the `before` or `after`

        relationships — at most one of the two may be set on a single request.

        Both reference a sibling wiki page by UUID; the server interprets them
        as

        a move hint, not a persistent link (they do not round-trip on GET). When

        a parent change is supplied without either, the page is appended to the

        end of the new parent's children. `precedence` is not accepted on PATCH

        (see PUT for the legacy absolute-precedence contract).
      properties:
        type:
          type: string
        id:
          description: The UUID of the page
          format: UuidPtr
          type: string
        attributes:
          $ref: '#/components/schemas/WikiPagePatchResource_attributes'
        relationships:
          $ref: '#/components/schemas/WikiPagePatchResource_relationships'
      type: object
    WikiPagePatchTopLevel:
      properties:
        data:
          $ref: '#/components/schemas/WikiPagePatchResource'
      required:
