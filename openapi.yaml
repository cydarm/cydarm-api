  /v0.9/case-report/{uuid}:
    get:
      description: >
        Generates an incident report for the specified case.


        Supported formats:

        - `markdown` (default): Returns the report as markdown text in a
        JSON:API response, suitable for client-side rendering to HTML and
        printing as PDF.

        - `docx`: Returns the report as a binary DOCX file download, converted
        via the Pandoc service.
      operationId: getCaseReport
      parameters:
        - description: The resource UUID
          in: path
          name: uuid
          required: true
          schema:
            format: UuidPtr
            type: string
        - description: >-
            Output format for the report. "markdown" returns the report as
            markdown text in a JSON:API response. "docx" returns the report as a
            binary DOCX file download.
          in: query
          name: format
          required: false
          schema:
            default: markdown
            enum:
              - markdown
              - docx
            type: string
        - description: >-
            Start time for the report window as an ISO 8601 timestamp (e.g.,
            "2024-01-15T10:00:00Z")
          in: query
          name: startTime
          required: false
          schema:
            format: date-time
            type: string
        - description: >-
            End time for the report window as an ISO 8601 timestamp (e.g.,
            "2024-01-31T23:59:59Z")
          in: query
          name: endTime
          required: false
          schema:
            format: date-time
            type: string
        - description: Timezone for timestamps in the report (e.g., "Australia/Sydney")
          in: query
          name: timezone
          required: false
          schema:
            default: UTC
            type: string
        - description: ACL groups to filter data visibility
          in: query
          name: aclGroups
          required: false
          schema:
            items:
              type: string
            type: array
        - description: Significance levels to include in the report
          in: query
          name: significances
          required: false
          schema:
            items:
              type: string
            type: array
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CaseReportTopLevel'
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                format: binary
                type: string
          description: The case report
        '404':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JsonApiError'
          description: Case not found
      summary: Generate a case report
      tags:
        - v09_case-report
