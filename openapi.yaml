    sort:
      description: >-
        Field to sort results by (description, created, modified, org, assignee,
        status, severity, severity_name, min_sla_name, min_sla_seconds, closed,
        actions, completed_actions)
      in: query
      name: sort
      required: false
      schema:
        default: created
        type: string
    sort-dir:
      description: Sort direction (asc or desc)
      in: query
      name: sort_dir
      required: false
      schema:
        default: desc
        enum:
          - asc
          - desc
        type: string
    filter-case:
      description: Filter by case UUID
      in: query
      name: filter[case]
      required: true
      schema:
        format: uuid
        type: string
